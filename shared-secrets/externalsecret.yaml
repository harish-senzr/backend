apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: backend-credentials
  namespace: default
spec:
  refreshInterval: 15s
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: backend-secrets
    creationPolicy: Owner
  data:
  # RDS Database Credentials
  - secretKey: DB_HOST
    remoteRef:
      key: "arn:aws:secretsmanager:ap-south-1:408194747663:secret:rds!db-6ffafcbb-b9d0-4e48-8b75-6d1fcf4214ac-QuVEtB"
      property: host
  - secretKey: DB_USER
    remoteRef:
      key: "arn:aws:secretsmanager:ap-south-1:408194747663:secret:rds!db-6ffafcbb-b9d0-4e48-8b75-6d1fcf4214ac-QuVEtB"
      property: username
  - secretKey: DB_PASSWORD
    remoteRef:
      key: "arn:aws:secretsmanager:ap-south-1:408194747663:secret:rds!db-6ffafcbb-b9d0-4e48-8b75-6d1fcf4214ac-QuVEtB"
      property: password
  - secretKey: DB_PORT
    remoteRef:
      key: "arn:aws:secretsmanager:ap-south-1:408194747663:secret:rds!db-6ffafcbb-b9d0-4e48-8b75-6d1fcf4214ac-QuVEtB"
      property: port
  - secretKey: DB_NAME
    remoteRef:
      key: "arn:aws:secretsmanager:ap-south-1:408194747663:secret:rds!db-6ffafcbb-b9d0-4e48-8b75-6d1fcf4214ac-QuVEtB"
      property: dbname

  # Redis HA Connection - Points to secrets you'll create manually
  - secretKey: REDIS_HOST
    remoteRef:
      key: "default-redis-ha-host"
      property: host
  - secretKey: REDIS_PASSWORD
    remoteRef:
      key: "default-redis-ha-password"
      property: password

  # NATS Connection - Points to secret you'll create manually
  - secretKey: NATS_URL
    remoteRef:
      key: "default-nats-connection"
      property: url

  # S3 Buckets - Points to secret you'll create manually
  - secretKey: S3_DIRECTUS_BUCKET
    remoteRef:
      key: "default-s3-config"
      property: directus_bucket
  - secretKey: S3_BACKUP_BUCKET
    remoteRef:
      key: "default-s3-config"
      property: backup_bucket
  - secretKey: S3_REGION
    remoteRef:
      key: "default-s3-config"
      property: region

  # Service Endpoints - Points to secret you'll create manually
  - secretKey: TEMPORAL_ADDRESS
    remoteRef:
      key: "default-service-endpoints"
      property: temporal_address
  - secretKey: OPENFAAS_URL
    remoteRef:
      key: "default-service-endpoints"
      property: openfaas_url