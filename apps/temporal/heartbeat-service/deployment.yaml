apiVersion: apps/v1
kind: Deployment
metadata:
  name: heartbeat-service
  labels:
    app: heartbeat-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: heartbeat-service
  template:
    metadata:
      labels:
        app: heartbeat-service
    spec:
      containers:
        - name: heartbeat-service
          image: harish7305/heartbeat-service:latest
          imagePullPolicy: Always
          env:
            - name: NATS_URL
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: NATS_URL
            - name: NATS_SUBJECT
              value: "attendance.heartbeat"
            - name: STREAM_NAME
              value: "attendance"
            - name: REDIS_HOST
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: REDIS_HOST
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: REDIS_PASSWORD
            - name: TEMPORAL_ADDRESS
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: TEMPORAL_ADDRESS
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: JWT_SECRET
      restartPolicy: Always
