name: Build and Push All Services

on:
  push:
    branches:
      - development  # Make sure 'development' exists in your repo

jobs:
  build-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: iwinxdigitaltechnologies
          password: jeyakumar1#

      ## Temporal Services

      - name: Build & Push cron-service
        uses: docker/build-push-action@v5
        with:
          context: ./apps/temporal/cron-service
          push: true
          tags: iwinxdigitaltechnologies/cron-service:latest

      - name: Build & Push heartbeat-service
        uses: docker/build-push-action@v5
        with:
          context: ./apps/temporal/heartbeat-service
          push: true
          tags: iwinxdigitaltechnologies/heartbeat-service:latest

      - name: Build & Push postrecord-service
        uses: docker/build-push-action@v5
        with:
          context: ./apps/temporal/postrecord-service
          push: true
          tags: iwinxdigitaltechnologies/postrecord-service:latest

      - name: Build & Push redis-service
        uses: docker/build-push-action@v5
        with:
          context: ./apps/temporal/redis-service
          push: true
          tags: iwinxdigitaltechnologies/redis-service:latest

      ## OpenFaaS Functions via faas-cli

      - name: Install faas-cli
        run: curl -sSL https://cli.openfaas.com | sudo sh

      - name: Build OpenFaaS functions
        working-directory: ./apps/openfaas-fun
        run: faas-cli build -f stack.yaml

      - name: Push OpenFaaS functions
        working-directory: ./apps/openfaas-fun
        run: |
          echo "jeyakumar1#" | docker login -u "iwinxdigitaltechnologies" --password-stdin
          faas-cli push -f stack.yaml
